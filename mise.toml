[tools]
node = "20.19.6"

[settings.node]
corepack = true

[tasks.setup]
description = "Install the locked Yarn dependency tree"
run = "yarn install --immutable"

[tasks.lint]
description = "Check repository formatting"
run = "yarn format:check"

[tasks.build]
description = "Build the production bundle"
run = "yarn build"
