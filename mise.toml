[tools]
node = "20.19.6"

[settings.node]
corepack = true

[tasks.setup]
description = "Install the locked Yarn dependency tree"
run = "yarn install --immutable"

[tasks.lint]
description = "Check repository formatting"
run = "yarn format:check"

[tasks.build]
description = "Build the production Node and browser applications"
run = "yarn build"

[tasks.start-local]
description = "Start the built application with the shared local environment"
env = { DOTENV_CONFIG_PATH = "{{env.HOME}}/.config/eolian/profiles/default.env" }
run = "yarn start"

[tasks.start-debug]
description = "Start the built application with the debugger and shared local environment"
env = { DOTENV_CONFIG_PATH = "{{env.HOME}}/.config/eolian/profiles/default.env" }
run = "yarn start-debug"

[tasks.e2e-test]
description = "Run the Discord playback harness against the test bot"
run = """
set -a
. "$HOME/.config/eolian/profiles/e2e-test.env"
set +a
yarn e2e
"""

[tasks.e2e-prod]
description = "Run the Discord playback harness against the production bot"
run = """
set -a
. "$HOME/.config/eolian/profiles/e2e-prod.env"
set +a
yarn e2e
"""
