<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eolian is a Discord music bot. Add songs and playlists from Spotify, SoundCloud, and YouTube, then control playback together."
    />
    <meta name="theme-color" content="#f7f7fb" />
    <link rel="icon" type="image/png" href="/web/assets/eolian-logo.png" />
    <title>Eolian — Discord music for the whole room</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem('eolian-theme');
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';

        document.documentElement.classList.add(theme);
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/web/index.tsx"></script>
  </body>
</html>
