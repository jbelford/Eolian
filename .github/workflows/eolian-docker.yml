name: Release production image

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release operation
        required: true
        type: choice
        options:
          - publish-and-deploy
          - publish-only
          - deploy-existing
        default: publish-and-deploy
      image_tag:
        description: Existing full 40-character Git commit SHA (deploy-existing only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: eolian-production-application
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select release image
        id: image
        env:
          REQUESTED_MODE: ${{ inputs.release_mode }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          mode="${REQUESTED_MODE:-publish-and-deploy}"
          if [[ "$mode" == "deploy-existing" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              echo "image_tag must be a full lowercase 40-character Git commit SHA" >&2
              exit 1
            fi
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_SHA"
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "reference=$ACR_LOGIN_SERVER/eolian:$tag" >>"$GITHUB_OUTPUT"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get temporary ACR token
        if: inputs.release_mode != 'deploy-existing'
        id: acr-token
        run: |
          token="$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            --output tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Sign in to ACR
        if: inputs.release_mode != 'deploy-existing'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Set up Docker Buildx
        if: inputs.release_mode != 'deploy-existing'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish immutable image
        if: inputs.release_mode != 'deploy-existing'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.reference }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify selected image exists
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository eolian \
            --output tsv |
            grep --fixed-strings --line-regexp --quiet "$IMAGE_TAG"

      - name: Deploy selected image
        if: inputs.release_mode != 'publish-only'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ steps.image.outputs.reference }}

      - name: Verify deployment
        if: inputs.release_mode != 'publish-only'
        run: |
          hostname="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://${hostname}/healthz" >/dev/null; then
              exit 0
            fi
            sleep 10
          done

          echo "Deployment health check did not become ready" >&2
          exit 1
